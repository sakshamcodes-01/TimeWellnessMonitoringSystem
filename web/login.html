<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WellTrack | Login</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }
        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #667eea, #764ba2);
        }
        .login-container {
            width: 380px;
            padding: 40px;
            border-radius: 25px;
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(15px);
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.25);
            color: white;
        }
        .logo {
            text-align: center;
            font-size: 32px;
            font-weight: bold;
            margin-bottom: 10px;
        }
        .logo span {
            color: #ffd369;
        }
        .subtitle {
            text-align: center;
            color: #eee;
            margin-bottom: 30px;
        }
        .input-group {
            margin-bottom: 20px;
        }
        label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
        }
        input {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 12px;
            outline: none;
            font-size: 15px;
        }
        .login-btn {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 25px;
            background: #ffd369;
            color: #333;
            font-size: 17px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 10px;
        }
        .login-btn:hover {
            transform: scale(1.02);
        }
        .register-text {
            text-align: center;
            margin-top: 25px;
            color: #eee;
        }
        .register-text a {
            color: #ffd369;
            text-decoration: none;
            font-weight: bold;
        }
        .back {
            display: block;
            text-align: center;
            margin-top: 20px;
            color: white;
            text-decoration: none;
        }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="logo">
            Well<span>Track</span>
        </div>
        <p class="subtitle">
            Welcome back! Login to continue.
        </p>
        <form action="login" method="post">
            <div class="input-group">
                <label>Email</label>
                <input
                    type="email"
                    name="email"
                    placeholder="Enter your email"
                    required>
            </div>
            <div class="input-group">
                <label>Password</label>
                <input
                    type="password"
                    name="password"
                    placeholder="Enter your password"
                    required>
            </div>
            <button type="submit" class="login-btn">
                Login →
            </button>
        </form>
        <p class="register-text">
            Don't have an account?
            <a href="register.html">Register</a>
        </p>
        <a href="index.html" class="back">
            ← Back to Home
        </a>
    </div>
</body>
</html>
