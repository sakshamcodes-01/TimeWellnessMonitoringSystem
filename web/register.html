<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WellTrack | Register</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }
        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #667eea, #764ba2);
            padding: 20px;
        }
        .register-container {
            width: 400px;
            padding: 40px;
            border-radius: 25px;
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(15px);
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.25);
            color: white;
        }
        .logo {
            text-align: center;
            font-size: 32px;
            font-weight: bold;
            margin-bottom: 8px;
        }
        .logo span {
            color: #ffd369;
        }
        .subtitle {
            text-align: center;
            color: #eee;
            margin-bottom: 25px;
        }
        .input-group {
            margin-bottom: 16px;
        }
        label {
            display: block;
            margin-bottom: 7px;
            font-weight: bold;
        }
        input,
        select {
            width: 100%;
            padding: 13px;
            border: none;
            border-radius: 12px;
            outline: none;
            font-size: 15px;
        }
        select {
            background: white;
        }
        .register-btn {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 25px;
            background: #ffd369;
            color: #333;
            font-size: 17px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 8px;
        }
        .login-text {
            text-align: center;
            margin-top: 22px;
            color: #eee;
        }
        .login-text a {
            color: #ffd369;
            text-decoration: none;
            font-weight: bold;
        }
        .back {
            display: block;
            text-align: center;
            margin-top: 18px;
            color: white;
            text-decoration: none;
        }
    </style>
</head>
<body>
    <div class="register-container">
        <div class="logo">
            Well<span>Track</span>
        </div>
        <p class="subtitle">
            Create your account
        </p>
        <form action="register" method="post">
            <div class="input-group">
                <label>Name</label>
                <input
                    type="text"
                    name="name"
                    placeholder="Enter your name"
                    required>
            </div>
            <div class="input-group">
                <label>Email</label>
                <input
                    type="email"
                    name="email"
                    placeholder="Enter your email"
                    required>
            </div>
            <div class="input-group">
                <label>Password</label>
                <input
                    type="password"
                    name="password"
                    placeholder="Create a password"
                    required>
            </div>
            <div class="input-group">
                <label>Role</label>
                <select name="role">
                    <option value="USER">USER</option>
                    <option value="ADMIN">ADMIN</option>
                </select>
            </div>
            <button type="submit" class="register-btn">
                Create Account →
            </button>
        </form>
        <p class="login-text">
            Already have an account?
            <a href="login.html">Login</a>
        </p>
        <a href="index.html" class="back">
            ← Back to Home
        </a>
    </div>
</body>
</html>
