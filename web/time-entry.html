<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>WellTrack - Time Entry</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            background: linear-gradient(
                135deg,
                #667eea,
                #764ba2,
                #f093fb
            );
            padding: 30px;
        }

        .navbar {
            background: rgba(255,255,255,0.18);
            backdrop-filter: blur(15px);
            padding: 18px 30px;
            border-radius: 18px;
            color: white;

            display: flex;
            justify-content: space-between;
            align-items: center;

            margin-bottom: 35px;
        }

        .logo {
            font-size: 25px;
            font-weight: bold;
        }

        .back {
            color: white;
            text-decoration: none;
            background: rgba(255,255,255,0.2);
            padding: 10px 18px;
            border-radius: 12px;
        }

        .container {
            max-width: 650px;
            margin: auto;
        }

        .heading {
            color: white;
            margin-bottom: 20px;
        }

        .heading h1 {
            font-size: 32px;
            margin-bottom: 8px;
        }

        .heading p {
            opacity: 0.9;
        }

        .form-card {
            background: rgba(255,255,255,0.96);
            padding: 35px;
            border-radius: 25px;
            box-shadow: 0 15px 40px rgba(0,0,0,0.18);
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
            color: #444;
        }

        input,
        textarea {
            width: 100%;
            padding: 14px;
            border: 2px solid #eee;
            border-radius: 12px;
            font-size: 15px;
            outline: none;
        }

        input:focus,
        textarea:focus {
            border-color: #667eea;
        }

        textarea {
            height: 100px;
            resize: none;
        }

        .submit-btn {
            width: 100%;
            padding: 15px;
            border: none;
            border-radius: 14px;

            background: linear-gradient(
                135deg,
                #667eea,
                #764ba2
            );

            color: white;
            font-size: 17px;
            font-weight: bold;
            cursor: pointer;

            margin-top: 10px;
        }

        .submit-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(102,126,234,0.35);
        }

        .tip {
            margin-top: 20px;
            padding: 15px;
            background: #f3f0ff;
            border-radius: 12px;
            color: #555;
            font-size: 14px;
        }
    </style>
</head>

<body>

    <div class="navbar">
        <div class="logo">💚 WellTrack</div>

        <a href="login.html" class="back">
            ← Dashboard
        </a>
    </div>

    <div class="container">

        <div class="heading">
            <h1>⏱️ Time Entry</h1>
            <p>Track your daily work and break hours.</p>
        </div>

        <div class="form-card">

            <form action="time-entry" method="post">

                <div class="form-group">
                    <label>⏱️ Work Hours</label>

                    <input
                        type="number"
                        name="workHours"
                        step="0.5"
                        min="0"
                        max="24"
                        placeholder="Example: 8"
                        required>
                </div>

                <div class="form-group">
                    <label>☕ Break Hours</label>

                    <input
                        type="number"
                        name="breakHours"
                        step="0.5"
                        min="0"
                        max="24"
                        placeholder="Example: 1.5"
                        required>
                </div>

                <div class="form-group">
                    <label>📅 Entry Date</label>

                    <input
                        type="date"
                        name="entryDate"
                        required>
                </div>

                <div class="form-group">
                    <label>📝 Description</label>

                    <textarea
                        name="description"
                        placeholder="What did you work on today?"
                        required></textarea>
                </div>

                <button type="submit" class="submit-btn">
                    Save Time Entry →
                </button>

            </form>

            <div class="tip">
                💡 <b>Tip:</b> Keep your work and break records updated
                to get better wellness insights.
            </div>

        </div>

    </div>

</body>
</html>
